# CI (SPEC §11 items 1, 2, 4, 12 and 15; PLAN §8). Nothing merges red. The `ci` job at the end is the
# single check to require in the main ruleset: it fails if any job above it failed or was cancelled.
# Uses no secret other than the automatic GITHUB_TOKEN.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint (ESLint + dependency-cruiser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: Unit, contract and conformance (simulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the coverage report diffs against the PR base
      - uses: ./.github/actions/setup

      # Enforces the hard coverage floor on packages/core (vitest.config.ts).
      - run: pnpm test:unit

      - name: Coverage on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/coverage-changed-lines.mjs --lcov coverage/lcov.info --base "$BASE_SHA" > coverage/changed-lines.md
          cat coverage/changed-lines.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so they see the job summary instead of a comment.
      - name: Post or update the coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            const body = fs.readFileSync('coverage/changed-lines.md', 'utf8')
            const marker = body.split('\n')[0]
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  integration:
    name: Integration (Testcontainers Postgres)
    runs-on: ubuntu-24.04 # ships Docker, which Testcontainers needs
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: docker info --format '{{.ServerVersion}}'
      - run: pnpm test:integration

  squawk:
    name: Migration lint (squawk)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Lints the SQL migrations added or changed by this PR (or push). A no-op until #5 adds
      # migrations under packages/db.
      - name: Find changed migrations
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # New branch or unknown base: lint every migration.
            git ls-files -- 'packages/db/*.sql' > changed.txt
          else
            git diff --name-only --diff-filter=AMR "$BASE_SHA...HEAD" -- 'packages/db/*.sql' > changed.txt
          fi
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat changed.txt
      - name: squawk
        if: steps.changed.outputs.count != '0'
        run: xargs --no-run-if-empty --delimiter '\n' npx --yes squawk-cli@2.73.0 < changed.txt
      - name: No migrations changed
        if: steps.changed.outputs.count == '0'
        run: echo "No migration files changed; nothing for squawk to lint."

  openapi:
    name: OpenAPI (drift, Spectral, oasdiff)
    runs-on: ubuntu-24.04 # ships Docker, which runs oasdiff
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # oasdiff compares against the base commit's document
      - uses: ./.github/actions/setup

      # SPEC §11 item 2. The committed document must be what the routes generate (the contract
      # tests in the unit job check this too, and validate responses against it).
      - name: openapi.json is up to date
        run: pnpm openapi:check

      - name: Spectral
        run: pnpm openapi:lint

      # Breaking changes inside /v1 fail CI (SPEC §1, §17). Compared with the base commit's
      # document; skipped when the base has none (the PR that introduces it).
      - name: Find the base document
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:apps/api/openapi.json" 2>/dev/null; then
            git show "$BASE_SHA:apps/api/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: oasdiff (breaking changes)
        if: steps.base.outputs.found == 'true'
        run: |
          cp apps/api/openapi.json "$RUNNER_TEMP/openapi-revision.json"
          docker run --rm -v "$RUNNER_TEMP:/w:ro" -w /w \
            tufin/oasdiff:v1.35.0@sha256:82b1840a77335562bb11ce95f77ad31745a0c6f3a770929333ed1c5ef466e400 \
            breaking openapi-base.json openapi-revision.json --fail-on ERR
      - name: No base document
        if: steps.base.outputs.found != 'true'
        run: echo "The base commit has no apps/api/openapi.json; nothing for oasdiff to compare."

  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, unit, integration, squawk, openapi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "::error::A required CI job did not pass."
            exit 1
          fi
