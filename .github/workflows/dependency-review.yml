# GitHub dependency review (SPEC §11 item 10): fails a PR that adds a dependency (runtime,
# development or unknown scope) with a known high or critical vulnerability.
# Uses only the automatic GITHUB_TOKEN.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # summary comment when the review fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # The action checks only runtime dependencies by default; dev tooling runs in CI too.
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: on-failure
