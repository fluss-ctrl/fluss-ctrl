# Install once per clone: pnpm exec lefthook install (the dev container does it for you).
# gitleaks must be on PATH (the dev container installs it: https://github.com/gitleaks/gitleaks).
pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,mjs,cjs,ts,mts,cts}'
      run: pnpm exec eslint {staged_files}
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
